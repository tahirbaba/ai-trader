name: risk-config-guard

# Fails any PR that touches config/risk.yaml or config/live_approval.yaml
# unless the PR carries the "owner-approved-risk" label.
#
# NOTE: GitHub's paths filter interacts correctly with required status checks.
# When no matching files are changed, GitHub marks the check as "skipped",
# which SATISFIES the required check — other PRs are never blocked.
#
# ── How to make this a required check ──────────────────────────────────────
# 1. Push this file to master (or open & merge a PR containing it).
# 2. Open any PR that changes config/risk.yaml so the workflow runs at least
#    once — GitHub only shows a check in the "required checks" UI after it has
#    run at least once on the target branch.
# 3. Go to: https://github.com/tahirbaba/ai-trader/settings/branches
# 4. Under "Branch protection rules", click "Edit" next to the master rule
#    (or "Add rule" if none exists, set Branch name pattern = master).
# 5. Check "Require status checks to pass before merging".
# 6. In the search box, type:  risk-config-guard / guard
#    Select the entry that appears (it must have run at least once — see step 2).
# 7. Optionally also check "Require branches to be up to date before merging".
# 8. Click "Save changes".
#
# The exact check name is: risk-config-guard / guard
# (format: <workflow name> / <job id>)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "config/risk.yaml"
      - "config/live_approval.yaml"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check for owner-approved-risk label
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'owner-approved-risk') }}
        run: |
          echo "PR labels contain 'owner-approved-risk': $HAS_LABEL"
          if [ "$HAS_LABEL" = "true" ]; then
            echo "✓ PR has 'owner-approved-risk' label — allowing risk config change."
          else
            echo "✗ BLOCKED: This PR changes a protected risk config file."
            echo ""
            echo "  Files protected:"
            echo "    config/risk.yaml"
            echo "    config/live_approval.yaml"
            echo ""
            echo "  To unblock: have the repo owner add the 'owner-approved-risk'"
            echo "  label to this PR. Do NOT add this label yourself."
            exit 1
          fi
