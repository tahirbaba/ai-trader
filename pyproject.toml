[project]
name = "ai-trader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tabulate>=0.9",
    "rich>=13.0",
    # Phase 1: config + DSOR
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    # Phase 2A: WebSocket support
    "websockets>=13.0",
    # Phase 2B: cross-asset + news
    "yfinance>=0.2",
    "feedparser>=6.0",
    # Phase 3: feature engineering
    "numpy>=1.26",
    # Phase 4: KSOR loader
    "python-frontmatter>=1.1",
    # Phase 6: Claude Brain
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-tabulate",
    "types-pyyaml",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["trader.risk.*", "trader.execution.*"]
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.hypothesis]
# Default profile — fast, used in CI on every push
max_examples = 100

[tool.hypothesis.profiles.ci]
# Thorough profile — run once before merging; catches rare edge cases
max_examples = 10000

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "pytest-cov>=7.1.0",
]
